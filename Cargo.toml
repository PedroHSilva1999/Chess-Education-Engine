[workspace]
resolver = "2"
members = [
    "crates/chess-core",
    "crates/chess-engine",
    "crates/chess-education",
    "crates/chess-session",
    "crates/chess-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Chess Education Engine contributors"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
prost = "0.14.1"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shakmaty = "0.30.1"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = "0.5"
tower-http = { version = "0.7.1", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.20", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
